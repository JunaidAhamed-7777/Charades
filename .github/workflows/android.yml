name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate bundled catalog and policies
        run: |
          python scripts/validate_catalog.py
          python scripts/sync_policies.py --check
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          python scripts/verify_apk.py
      - name: Save the complete installable APK
        uses: actions/upload-artifact@v4
        with:
          name: charades-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
